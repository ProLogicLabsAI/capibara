id: classify-risk
intent: Classify a document or transaction into risk categories for human review and downstream routing.
subject: document

inputs:
  - name: document
    type: text
    required: true
    description: The document or transaction record to be assessed.
  - name: domain
    type: identifier
    required: false
    description: Business domain context for the classification (e.g. trade-finance, insurance, procurement).

outputs:
  - name: risk_classification
    type: json-object
    description: Assigned risk category, confidence signal, and rationale summary.
  - name: recommended_action
    type: enum-label
    description: Suggested next step — approve, escalate, or flag-for-review.

owner: risk-office
tags: [risk, compliance, enterprise, classification]

risk:
  level: medium
  notes: >
    Output is advisory. No automated enforcement in V0. All high-risk classifications
    must be reviewed by a qualified risk officer before action is taken.
    Numeric thresholds and approval matrices are defined in the referenced rubric.

semantic_refs:
  - "policy://risk/classification-rubric-v1"
  - "policy://compliance/escalation-matrix-v2"

behavior_profiles:
  - id: conservative
    description: Prefer false positives over false negatives; escalate all borderline cases for human review.
  - id: aggressive
    description: Minimize escalations by accepting wider classification confidence bands; only escalate clear high-risk items.
